name: cyy-campus-trade
services:
  mysql:
    image: mysql:8.4.11
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-campus_trade}
      MYSQL_USER: ${MYSQL_USER:-campus_trade}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
    volumes:
      - mysql-data:/var/lib/mysql
    networks: [trade-network]
    healthcheck:
      test: ["CMD-SHELL", "mysql --protocol=TCP -h 127.0.0.1 -u\"$${MYSQL_USER}\" -p\"$${MYSQL_PASSWORD}\" \"$${MYSQL_DATABASE}\" -e 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
  app:
    image: campus-trade:week05
    build:
      context: ./monolith
    ports:
      - "127.0.0.1:${APP_PORT:-8084}:8080"
    environment:
      DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-campus_trade}?connectionTimeZone=UTC
      DB_USER: ${MYSQL_USER:-campus_trade}
      DB_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
    depends_on:
      mysql:
        condition: service_healthy
    networks: [trade-network]
volumes:
  mysql-data:
networks:
  trade-network:
