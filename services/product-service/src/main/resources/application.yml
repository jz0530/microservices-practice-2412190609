server:
  port: ${SERVER_PORT:8102}
spring:
  application:
    name: product-service
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/trade_product?connectionTimeZone=UTC}
    username: ${DB_USER:trade_product}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
management:
  endpoints:
    web:
      exposure:
        include: health
