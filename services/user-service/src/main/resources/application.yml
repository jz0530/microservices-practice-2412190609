server:
  port: ${SERVER_PORT:8101}
spring:
  application:
    name: user-service
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:}
        group: PERSONAL_GROUP
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/trade_user?connectionTimeZone=UTC}
    username: ${DB_USER:trade_user}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
management:
  endpoints:
    web:
      exposure:
        include: health
