spring:
  cloud:
    nacos:
      discovery:
        enabled: false
    service-registry:
      auto-registration:
        enabled: false
    openfeign:
      client:
        config:
          default:
            connectTimeout: 300
            readTimeout: 300
  datasource:
    url: jdbc:h2:mem:order_test;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
