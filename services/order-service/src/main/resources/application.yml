server:
  port: ${SERVER_PORT:8103}
spring:
  application:
    name: order-service
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:}
        group: PERSONAL_GROUP
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/trade_order?connectionTimeZone=UTC}
    username: ${DB_USER:trade_order}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
management:
  endpoints:
    web:
      exposure:
        include: health
clients:
  connect-timeout-ms: ${HTTP_CONNECT_TIMEOUT_MS:2000}
  read-timeout-ms: ${HTTP_READ_TIMEOUT_MS:3000}
