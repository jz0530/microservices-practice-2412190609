name: cyy-trade-week07
services:
  nacos:
    image: nacos/nacos-server:v3.2.4
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: "true"
      NACOS_AUTH_CONSOLE_ENABLE: "true"
      NACOS_AUTH_ADMIN_ENABLE: "true"
      NACOS_AUTH_TOKEN: ${NACOS_AUTH_TOKEN:?Set NACOS_AUTH_TOKEN in .env}
      NACOS_AUTH_IDENTITY_KEY: ${NACOS_AUTH_IDENTITY_KEY:?Set NACOS_AUTH_IDENTITY_KEY in .env}
      NACOS_AUTH_IDENTITY_VALUE: ${NACOS_AUTH_IDENTITY_VALUE:?Set NACOS_AUTH_IDENTITY_VALUE in .env}
    ports:
      - "127.0.0.1:18080:8080"
      - "127.0.0.1:8848:8848"
      - "127.0.0.1:9848:9848"
    volumes:
      - nacos-data:/home/nacos/data
    networks: [service-network]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/ >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  user-mysql:
    image: mysql:8.4.11
    environment:
      MYSQL_DATABASE: trade_user
      MYSQL_USER: trade_user
      MYSQL_PASSWORD: ${USER_DB_PASSWORD:?Set USER_DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${USER_DB_ROOT_PASSWORD:?Set USER_DB_ROOT_PASSWORD in .env}
    volumes:
      - user-data:/var/lib/mysql
    networks: [service-network]
    healthcheck:
      test: ["CMD-SHELL", "mysql --protocol=TCP -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD $$MYSQL_DATABASE -e 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  user-service:
    image: campus-trade-user:week07
    build: ./services/user-service
    ports:
      - "127.0.0.1:${USER_PORT:-8101}:8080"
    environment:
      SERVER_PORT: 8080
      DB_URL: jdbc:mysql://user-mysql:3306/trade_user?connectionTimeZone=UTC
      DB_USER: trade_user
      DB_PASSWORD: ${USER_DB_PASSWORD:?Set USER_DB_PASSWORD in .env}
      NACOS_SERVER_ADDR: nacos:8848
      NACOS_USERNAME: nacos
      NACOS_PASSWORD: ${NACOS_PASSWORD:?Set NACOS_PASSWORD in .env}
    depends_on:
      user-mysql:
        condition: service_healthy
      nacos:
        condition: service_healthy
    networks: [service-network]

  product-mysql:
    image: mysql:8.4.11
    environment:
      MYSQL_DATABASE: trade_product
      MYSQL_USER: trade_product
      MYSQL_PASSWORD: ${PRODUCT_DB_PASSWORD:?Set PRODUCT_DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${PRODUCT_DB_ROOT_PASSWORD:?Set PRODUCT_DB_ROOT_PASSWORD in .env}
    volumes:
      - product-data:/var/lib/mysql
    networks: [service-network]
    healthcheck:
      test: ["CMD-SHELL", "mysql --protocol=TCP -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD $$MYSQL_DATABASE -e 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  product-service:
    image: campus-trade-product:week07
    build: ./services/product-service
    ports:
      - "127.0.0.1:${PRODUCT_PORT:-8102}:8080"
    environment:
      SERVER_PORT: 8080
      DB_URL: jdbc:mysql://product-mysql:3306/trade_product?connectionTimeZone=UTC
      DB_USER: trade_product
      DB_PASSWORD: ${PRODUCT_DB_PASSWORD:?Set PRODUCT_DB_PASSWORD in .env}
      NACOS_SERVER_ADDR: nacos:8848
      NACOS_USERNAME: nacos
      NACOS_PASSWORD: ${NACOS_PASSWORD:?Set NACOS_PASSWORD in .env}
    depends_on:
      product-mysql:
        condition: service_healthy
      nacos:
        condition: service_healthy
    networks: [service-network]

  order-mysql:
    image: mysql:8.4.11
    environment:
      MYSQL_DATABASE: trade_order
      MYSQL_USER: trade_order
      MYSQL_PASSWORD: ${ORDER_DB_PASSWORD:?Set ORDER_DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${ORDER_DB_ROOT_PASSWORD:?Set ORDER_DB_ROOT_PASSWORD in .env}
    volumes:
      - order-data:/var/lib/mysql
    networks: [service-network]
    healthcheck:
      test: ["CMD-SHELL", "mysql --protocol=TCP -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD $$MYSQL_DATABASE -e 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  order-service:
    image: campus-trade-order:week07
    build: ./services/order-service
    ports:
      - "127.0.0.1:${ORDER_PORT:-8103}:8080"
    environment:
      SERVER_PORT: 8080
      DB_URL: jdbc:mysql://order-mysql:3306/trade_order?connectionTimeZone=UTC
      DB_USER: trade_order
      DB_PASSWORD: ${ORDER_DB_PASSWORD:?Set ORDER_DB_PASSWORD in .env}
      NACOS_SERVER_ADDR: nacos:8848
      NACOS_USERNAME: nacos
      NACOS_PASSWORD: ${NACOS_PASSWORD:?Set NACOS_PASSWORD in .env}
      HTTP_CONNECT_TIMEOUT_MS: 2000
      HTTP_READ_TIMEOUT_MS: 3000
    depends_on:
      order-mysql:
        condition: service_healthy
      nacos:
        condition: service_healthy
    networks: [service-network]

volumes:
  nacos-data:
  user-data:
  product-data:
  order-data:
networks:
  service-network:
